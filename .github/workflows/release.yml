name: Release
# Fires when a version tag is pushed (e.g. `v0.4.0`). Cross-compiles static
# binaries (CGO_ENABLED=0; the SQLite driver is pure Go), writes SHA-256
# checksums, and publishes them as a GitHub Release with generated notes.
# The tag is the single source of the version: it is stamped into the binary
# with -ldflags, so `codeshot --version` can never disagree with the release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets; nothing more

jobs:
  release:
    name: Build + publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: sudo apt-get update && sudo apt-get install -y graphviz && go test ./...

      - name: Cross-compile
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="codeshot_${version}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/inth3shadows/codeshot/internal/codeshot.Version=${version}" \
              -o "dist/$name/codeshot$ext" ./cmd/codeshot
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/checksums.txt --generate-notes --title "${GITHUB_REF_NAME}"
