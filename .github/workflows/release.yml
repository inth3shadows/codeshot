name: Release
# Fires when a version tag is pushed (e.g. `v0.4.0`). Cross-compiles static
# binaries (CGO_ENABLED=0; the SQLite driver is pure Go) and writes a CycloneDX
# SBOM and SHA-256 checksums in one job; a second job, which runs no build or
# test code, attests build provenance and the SBOM for every archive (keyless,
# through Sigstore with its OIDC token) and publishes them as a GitHub Release
# with generated notes.
# The tag is the single source of the version: it is stamped into the binary
# with -ldflags, so `codeshot --version` can never disagree with the release.
# Verify a download: `gh attestation verify <archive> --repo inth3shadows/codeshot
#   --signer-workflow inth3shadows/codeshot/.github/workflows/release.yml`.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # Runs the tests, the build and the SBOM tool, so it gets no signing
  # permission: code here can't mint the OIDC token the attestations are
  # signed with (F1). It hands the release files to the publish job.
  build:
    name: Test, build + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: sudo apt-get update && sudo apt-get install -y graphviz && go test ./...

      - name: Cross-compile
        id: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A release tag is v<semver>: anything else would name the archives
          # one way and give the SBOM a pseudo-version (F6).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>[-<pre>]"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="codeshot_${version}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/inth3shadows/codeshot/internal/codeshot.Version=${version}" \
              -o "dist/$name/codeshot$ext" ./cmd/codeshot
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          # One SBOM for the module (all six builds share its dependencies),
          # pinned through the Go checksum database. The tag checkout gives it
          # the version.
          # -std lists the Go standard library compiled into every binary (F2).
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            mod -licenses -std -json -output "dist/codeshot_${version}.cdx.json"
          (cd dist && sha256sum *.tar.gz *.zip *.cdx.json > checksums.txt)

      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  # Signs and publishes; runs no build, test or third-party build code.
  publish:
    name: Attest + publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # the OIDC token Sigstore signs the attestations with
      attestations: write # store the provenance and SBOM attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Check the files arrived intact
        run: cd dist && sha256sum -c checksums.txt

      # Provenance for every archive and the SBOM, in one attestation over the
      # checksums file; then the SBOM, attested for the archives it describes.
      # actions/attest directly: attest-build-provenance and attest-sbom are
      # wrappers around it, and attest-sbom is deprecated (F5).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/codeshot_${{ needs.build.outputs.version }}.cdx.json
          create-storage-record: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/*.cdx.json dist/checksums.txt --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}"
