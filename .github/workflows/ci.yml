name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly canary: the npm-codegraph job below runs unpinned `@latest`, so a new
  # codegraph release that changes output codeshot parses (or its index schema,
  # which --architecture reads directly) surfaces here, not in a bug report.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read # least privilege — the workflow only reads the repo

jobs:
  test:
    name: Test, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `dot` is a hard runtime dependency; the DOT-validity tests shell out to
      # it. Tests needing codegraph or an index self-skip here (CI has neither).
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # The suite again, against the npm codegraph releases users install, with
  # this repo indexed so the end-to-end tests run. 1.6.0 is the floor: earlier
  # builds' `query --json` carries no qualifiedName, which --architecture's
  # direct index read needs. The weekly schedule swaps in unpinned `@latest`.
  # It does NOT run the diagram --check: committed diagrams are rendered with
  # the inth3shadows fork (see the diagrams job).
  test-npm-codegraph:
    name: Tests (npm codegraph ${{ matrix.codegraph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codegraph: ${{ github.event_name == 'schedule' && fromJSON('["latest"]') || fromJSON('["1.6.0"]') }}
    steps:
      # Full history: the --diff end-to-end test diffs real commits.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # codegraph is a Node CLI and refuses Node 25+.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install codegraph ${{ matrix.codegraph }} from npm
        run: |
          npm install -g "@colbymchenry/codegraph@${{ matrix.codegraph }}"
          codegraph --version
      - name: Build the codegraph index
        run: codegraph init .
      - run: go test ./...

  diagrams:
    name: Diagrams are current (codeshot --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # --check compares diagram STRUCTURE (node/edge set) for svg, not bytes,
      # so the CI graphviz version need not match the one that drew the image.
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # The index codeshot reads: the inth3shadows/codegraph fork at tag
      # v1.6.0-em.8, pinned by commit SHA (tags are mutable): npm 1.6.0 plus
      # upstream fixes merged but not yet released, notably #1801 (callers/
      # callees --json grouped per definition), which --diff's per-file
      # attribution needs. Committed diagrams must be regenerated with this same
      # build. Cloned into $RUNNER_TEMP so `codegraph init .` doesn't index it.
      # WASM-only (CODEGRAPH_KERNEL=0): the fork's native kernel still carries a
      # fabricated-edge bug.
      - name: Build codegraph fork (v1.6.0-em.8)
        env:
          FORK_SHA: ceefd258adcaf6cbdb743bf4574d3cf501dd58d5
        run: |
          FORK="$RUNNER_TEMP/codegraph-fork"
          git init -q "$FORK"
          git -C "$FORK" fetch -q --depth 1 https://github.com/inth3shadows/codegraph.git "$FORK_SHA"
          git -C "$FORK" checkout -q FETCH_HEAD
          (cd "$FORK" && npm ci && npm run build)
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexport CODEGRAPH_KERNEL=0\nexec node "%s/dist/bin/codegraph.js" "$@"\n' "$FORK" > "$RUNNER_TEMP/bin/codegraph"
          chmod +x "$RUNNER_TEMP/bin/codegraph"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the codegraph index
        run: |
          codegraph init .
          codegraph status .   # visibility: a partial index prints an unresolved-refs warning

      - name: Build codeshot
        run: go build -o "$RUNNER_TEMP/bin/codeshot" ./cmd/codeshot

      # Blocking gate: fail the PR if either committed diagram no longer matches
      # what the current code produces.
      - name: Check committed diagrams are current
        run: |
          codeshot --architecture --path . --max-symbols 5000 --format svg \
            --out docs/architecture.svg --embed TECHNICAL.md --check
          codeshot BuildDot --path . --format svg \
            --out docs/BuildDot-callgraph.svg --embed TECHNICAL.md --check
